name: Run Stock Script

on:
  ## schedule:
  ##  - cron: '0 * * * *' # Runs every hour - removing code to schedule script to run every hour, as it is not needed for this project
  workflow_dispatch:

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        run: python script.py